name: Firefox upstream compatibility

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Candidate mozilla/translations revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  m0-hard-stop:
    name: Firefox compatibility / M0 hard stop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/verify-m0-scope.sh upstream
      - run: test -n '${{ inputs.revision }}'
