name: Firefox upstream compatibility

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Candidate mozilla/translations revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  m1-identity-gate:
    name: Firefox compatibility / M1 identity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/verify-scope.sh upstream
      - name: Validate candidate revision identity
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: '[[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
