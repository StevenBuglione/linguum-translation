name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate SemVer; feasibility milestones perform no publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  m0-hard-stop:
    name: Release / M0 hard stop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/verify-scope.sh release
      - run: test -n '${{ inputs.version }}'

  android-physical-arm64:
    name: Release / Android physical arm64 canary
    runs-on: [self-hosted, linux, arm64, android-device]
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      LINGUUM_ANDROID_EXPECTED_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
      - run: >-
          python3 scripts/native/android_profiles.py
          --profile all
          --clean
          --iterations 100
          --device-mode physical

  ios-physical-arm64:
    name: Release / Apple physical arm64 export canary
    runs-on: [self-hosted, macos, arm64, ios-device]
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
      - run: >-
          python3 scripts/native/apple_export.py
          --profile ios-arm64
          --clean
          --iterations 100
          --execution-tier physical-arm64
