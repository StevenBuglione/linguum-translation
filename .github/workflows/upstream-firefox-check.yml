name: Firefox upstream check

on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-scaffold:
    name: Firefox upstream / M0 scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/verify-m0-scope.sh upstream
