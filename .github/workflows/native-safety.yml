name: Native safety

on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/native/**'
      - 'testing/native/**'
      - 'toolchains/native-tools.lock.json'
      - 'toolchains/linux-native-profiles.lock.json'
      - 'toolchains/macos-native-profiles.lock.json'
      - 'toolchains/windows-native-profiles.lock.json'
      - 'toolchains/ios-native-profiles.lock.json'
      - 'toolchains/apple-export.lock.json'
      - 'testing/platform-smoke/apple-export-canary/**'
      - 'testing/platform-smoke/ios-canary/**'
      - '.github/workflows/native-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone-gate:
    name: Native safety / Milestone gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh native
      - run: python3 scripts/native/macos_profiles.py --profile macos-arm64 --clean --iterations 100

  intel-profile:
    name: Native safety / macOS Intel profile
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/native/macos_profiles.py --profile macos-x64 --clean --iterations 100

  ios-intel-simulator:
    name: Native safety / Apple Intel simulator export
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: >-
          python3 scripts/native/apple_export.py
          --profile ios-simulator-x64
          --clean
          --iterations 100
          --execution-tier simulator-x64

  linux-x64-build:
    name: Native safety / Linux x64 glibc 2.35 build and sanitizers
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/native/linux_profiles.py --profile linux-x64-avx2 --clean --iterations 100
      - run: python3 scripts/native/linux_profiles.py --profile linux-x64-baseline --clean --iterations 100
      - run: python3 scripts/native/linux_profiles.py --profile linux-x64-baseline --clean --iterations 10 --sanitizers address,undefined
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-glibc-2.35-compatibility
          path: build/native-packages/linux/compatibility
          if-no-files-found: error
          retention-days: 3

  linux-x64-current:
    name: Native safety / Linux x64 Ubuntu 24.04 compatibility
    needs: linux-x64-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-x64-glibc-2.35-compatibility
          path: build/native-packages/linux/compatibility
      - run: python3 scripts/native/linux_profiles.py --profile linux-x64-avx2 --verify-only --artifact build/native-packages/linux/compatibility/linux-x64-avx2 --iterations 100
      - run: python3 scripts/native/linux_profiles.py --profile linux-x64-baseline --verify-only --artifact build/native-packages/linux/compatibility/linux-x64-baseline --iterations 100

  linux-arm64-build:
    name: Native safety / Linux arm64 glibc 2.35 build and sanitizers
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/native/linux_profiles.py --profile linux-arm64 --clean --iterations 100
      - run: python3 scripts/native/linux_profiles.py --profile linux-arm64 --clean --iterations 10 --sanitizers address,undefined
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-glibc-2.35-compatibility
          path: build/native-packages/linux/compatibility/linux-arm64
          if-no-files-found: error
          retention-days: 3

  linux-arm64-current:
    name: Native safety / Linux arm64 Ubuntu 24.04 compatibility
    needs: linux-arm64-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: linux-arm64-glibc-2.35-compatibility
          path: build/native-packages/linux/compatibility/linux-arm64
      - run: python3 scripts/native/linux_profiles.py --profile linux-arm64 --verify-only --artifact build/native-packages/linux/compatibility/linux-arm64 --iterations 100
