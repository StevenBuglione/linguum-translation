name: Native safety

on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/native/**'
      - 'testing/native/**'
      - 'toolchains/native-tools.lock.json'
      - '.github/workflows/native-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone-gate:
    name: Native safety / Milestone gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh native
      - run: python3 scripts/native/run_host_canary.py --clean --iterations 100
