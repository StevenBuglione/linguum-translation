name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: PR / Architecture and protected files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: bash scripts/ci/verify-scope.sh architecture

  quality:
    name: PR / Formatting, compiler, Detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh quality

  api-abi:
    name: PR / API and ABI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh api

  kotlin-jvm:
    name: PR / Kotlin common and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh kotlin

  windows:
    name: PR / Windows native and JVM integration
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - shell: pwsh
        run: ./scripts/ci/verify-scope.ps1 -Scope windows

  linux:
    name: PR / Linux x64 native and JVM integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh linux

  macos:
    name: PR / macOS native and JVM integration
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LINGUUM_MACOS_PROFILE: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh macos

  macos-intel:
    name: PR / macOS Intel native integration
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      LINGUUM_MACOS_PROFILE: macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh macos

  android:
    name: PR / Android build and emulator integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh android

  ios:
    name: PR / iOS build and simulator integration
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh ios

  consumer-kotlin-java:
    name: PR / Consumer fixtures Kotlin and Java
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh consumers

  consumer-swift:
    name: PR / Consumer fixture Swift
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh swift

  native-safety:
    name: PR / Native safety smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh native

  models:
    name: PR / Model manifest and canary pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/verify-scope.sh models

  license-supply-chain:
    name: PR / License, dependency, SBOM smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - run: bash scripts/ci/verify-scope.sh license

  artifact-integrity:
    name: PR / Artifact integrity and publication smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-gradle
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: bash scripts/ci/verify-scope.sh artifacts
