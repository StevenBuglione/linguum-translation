schema_version: 1
runners:
  linux_default: ubuntu-24.04
  linux_native_compatibility: ubuntu-22.04
  linux_arm64_native_compatibility: ubuntu-22.04-arm
  linux_arm64_current: ubuntu-24.04-arm
  macos_default: macos-15
  macos_intel: macos-15-intel
  windows_default: windows-2025
  android_physical_arm64:
    - self-hosted
    - linux
    - arm64
    - android-device
  ios_physical_arm64:
    - self-hosted
    - macos
    - arm64
    - ios-device
policy:
  floating_labels: forbidden
  changes_require: pull_request_and_green_protected_checks
